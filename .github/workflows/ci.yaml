name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The CAD kernel needs these system libraries at import time
      - run: sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=5 libgl1 libglu1-mesa libxrender1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run pytest -q

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .

  submit:
    # Every push to main is a submission: image to the organisers' registry, outputs to their bucket.
    # Skipped until the organisers' variables and secrets are set on the repo.
    if: github.event_name == 'push' && vars.ECR_REPOSITORY_URI != ''
    needs: test
    runs-on: ubuntu-latest
    concurrency: submit
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: ./.ci/push.sh
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          S3_SUBMISSION_URI: ${{ vars.S3_SUBMISSION_URI }}
