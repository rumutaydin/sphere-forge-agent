name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
