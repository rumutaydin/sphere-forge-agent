[project]
name = "forge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cadquery>=2.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "pillow>=13.0.0",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
